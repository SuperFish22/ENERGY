# Сайт и бот в Docker. Снаружи их закрывает nginx на самом сервере (deploy/nginx/energy.conf).
# Порт 8000 открыт только для localhost — из интернета к нему не подключиться напрямую.
services:
  web:
    build: .
    env_file: .env
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - ./data:/srv/data
    restart: unless-stopped

  bot:
    build: .
    command: python bot.py
    env_file: .env
    volumes:
      - ./data:/srv/data
    restart: unless-stopped
    depends_on: [web]
