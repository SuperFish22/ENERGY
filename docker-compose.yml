# Сайт в Docker. Снаружи его закрывает nginx на самом сервере (deploy/nginx/energy.conf).
# Порт 8000 открыт только для localhost — из интернета к нему не подключиться напрямую.
# Телеграм-бот живёт на другом сервере — см. папку bot/.
services:
  web:
    build: .
    env_file: .env
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - ./data:/srv/data
    restart: unless-stopped
