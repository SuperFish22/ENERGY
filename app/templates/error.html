{% extends "base.html" %}
{% block title %}{{ title }} — {{ config.SITE_NAME }}{% endblock %}
{% block robots %}<meta name="robots" content="noindex">{% endblock %}
{% block content %}
<section class="page"><div class="wrap center">
  <p class="kicker">Ошибка {{ code }}</p>

</div></section>
{% endblock %}
