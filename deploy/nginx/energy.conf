# nginx для сайта ENERGY
# Положить в /etc/nginx/sites-available/energy.conf, сделать ссылку в sites-enabled,
# заменить energy-academy.ru на ваш домен и /opt/energy-site — на папку проекта.
# HTTPS: sudo certbot --nginx -d energy-academy.ru -d www.energy-academy.ru
# (certbot сам допишет сертификаты и редирект с http на https).

upstream energy_app {
    server 127.0.0.1:8000;
    keepalive 16;
}

server {
    listen 80;
    listen [::]:80;
    server_name energy-academy.ru www.energy-academy.ru;

    # www → без www
    if ($host = www.energy-academy.ru) {
        return 301 $scheme://energy-academy.ru$request_uri;
    }

    # Файлы в базу знаний — до 50 МБ (как в app/utils.py)
    client_max_body_size 55m;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml application/xml text/plain;
    gzip_min_length 1024;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Frame-Options SAMEORIGIN always;

    # Статика (css, js, картинки) — nginx отдаёт сам, без Python
    location /static/ {
        alias /opt/energy-site/app/static/;
        expires 7d;
        add_header Cache-Control "public";
        access_log off;
    }

    # Фото слайдера — тоже напрямую с диска
    location /media/slides/ {
        alias /opt/energy-site/data/uploads/slides/;
        expires 7d;
        add_header Cache-Control "public";
        access_log off;
    }

    # Файлы базы знаний НЕ отдаём напрямую: закрытые материалы проверяет сайт (/files/kb/…)
    location /uploads/ {
        return 404;
    }

    location / {
        proxy_pass http://energy_app;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        proxy_request_buffering off;
    }
}
